schema_version: 1
repository: boardoor-sdk
default_branch: main
live_application_required: true
ruleset:
  scope: repository
  target: branch
  enforcement: active
  include:
    - refs/heads/main
  bypass_actors: []
  required:
    pull_request: true
    approvals: 0
    code_owner_review: false
    conversation_resolution: true
    deletion_blocked: true
    force_push_blocked: true
    direct_push_blocked: true
    required_status_checks:
      - 'CI / verify'
      # Add the observed DCO check only after the live unsigned/signed canary.
  dco:
    app_required: true
    standard: DCO-1.1
    selected_repository_only: true
    exact_live_check_name: TO_BE_RECORDED_FROM_LIVE_DCO_CANARY
    replace_placeholder_with_observed_required_check: true
    unsigned_commit_must_fail: true
    signed_off_commit_must_pass: true
  routine_bypass_allowed: false
repository_security:
  private_vulnerability_reporting: required
actions:
  default_token: read_only
  allow_actions_to_create_or_approve_pull_requests: false
  fork_pull_request_approval: all_external_contributors
  self_hosted_runner_for_fork_code: forbidden
release_environment:
  name: npm-release
  required_reviewers_minimum: 0
  prevent_self_review: false
  live_approval: owner_workflow_dispatch
  deployment_branch_policy: main_only
  administrator_bypass: false
  trusted_publishing_relationship: required_live_setup
  reviewed_commit_input: full_sha_required
release_script_contract:
  build_command: pnpm exec tsx scripts/release.ts --pack core|ui
  publish_command: npm publish <reviewed-immutable-tarball> --access public --tag next --provenance
  required_dispatch_inputs:
    - package
    - expected_commit
    - expected_version
    - expected_tarball_sha256
  fixed_initial_dist_tag: next
  unit_of_resume: one_package
  fail_closed_checks:
    - exact_main_sha_checked_before_dependency_install
    - package_versions_match_reviewed_candidate
    - fixed_next_dist_tag
    - package_projection_and_release_checks_run_without_id_token
    - build_pack_uses_lock_integrity_pinned_npm_11_5_1
    - build_and_pack_job_has_no_id_token
    - publish_job_has_no_checkout_or_dependency_install
    - publish_job_uses_node_24_6_0_bundled_npm_11_5_1
    - publish_job_only_receives_reviewed_immutable_tarball
    - steady_publish_rejects_npm_tokens
    - steady_publish_uses_trusted_publishing
    - trusted_publisher_allowed_action_is_npm_publish_only
    - registry_tarball_sha256_matches_reviewed_candidate
verification:
  - confirm_ruleset_effective_via_api_or_settings_snapshot
  - confirm_codeowners_team_exists_and_is_accessible
  - confirm_dco_app_publisher_permissions_selection_and_installer
  - add_exact_live_dco_check_name_after_canary
  - prove_unsigned_commit_fails_and_signed_off_commit_passes
  - prove_self_authored_pr_mergeable_only_after_ci_dco_and_conversation_resolution
  - record_external_pr_owner_review_operating_evidence
  - confirm_private_vulnerability_reporting_is_reachable
  - confirm_no_repository_or_environment_secret_reaches_fork_ci
  - confirm_workflow_dispatch_actor_is_the_authorized_owner
  - prove_bootstrap_core_and_ui_registry_tarballs_match_reviewed_sha256
  - prove_trusted_publishing_bound_separately_for_core_and_ui
  - prove_token_based_package_publishing_disabled_after_bootstrap
notes:
  - This file records the settings this repository runs under. A checked-in file cannot configure GitHub, install an App, or create a team, so the settings are applied and verified against the live repository.
  - The first version of each package was published over OIDC after registering the package name; no publishing token was issued, and the bootstrap workflow and environment have been removed.
  - core and ui are independent resume units: if one succeeds and the other fails, do not republish the successful package; correct the cause and dispatch only the failed one with the same reviewed commit, version, and digest.
  - Initial operation is intentionally single-operator: CODEOWNERS routes ownership but is not a required review, and owner workflow_dispatch is the live npm approval. CI, DCO, conversation resolution, direct-push protection, and no routine bypass remain mandatory.
  - When a reviewer who will actively review routine changes joins, strengthen both repositories to one required approval plus required CODEOWNER review and both npm environments to one required reviewer with prevent_self_review enabled. Record and canary the effective settings before relying on the stronger gate.
  - Each package binds npm Trusted Publishing to this repository and .github/workflows/npm-release.yml, allowing only the npm publish action, with token-based publishing disallowed.
  - Private candidate/artifact parity is an activation-runbook gate completed before release dispatch.
